<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專案管理 PMA 認證 · 第一次全真模擬考 (A 卷 100 題) 官方全解析與班級自習系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-paper: #f8f6f0;
      --color-paper-card: #ffffff;
      --color-paper-subtle: #f0eee6;
      --color-ink: #18181b;
      --color-ink-muted: #71717a;
      --color-rule: #e4e0d5;
      --color-rule-subtle: #eeebe3;
      --color-accent: #0284c7;
      --color-accent-subtle: #e0f2fe;

      --color-success: #059669;
      --color-success-bg: #ecfdf5;
      --color-success-border: #a7f3d0;
      --color-danger: #dc2626;
      --color-danger-bg: #fef2f2;
      --color-danger-border: #fecaca;
      --color-purple: #7c3aed;
      --color-purple-bg: #f5f3ff;
      --color-gold: #d97706;
      --color-gold-bg: #fef3c7;

      --font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --font-body: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --color-paper: #090c10;
      --color-paper-card: #13171f;
      --color-paper-subtle: #1a202c;
      --color-ink: #f4f4f5;
      --color-ink-muted: #a1a1aa;
      --color-rule: #272d38;
      --color-rule-subtle: #1e2430;
      --color-accent: #38bdf8;
      --color-accent-subtle: #082f49;

      --color-success: #10b981;
      --color-success-bg: #064e3b;
      --color-success-border: #047857;
      --color-danger: #f87171;
      --color-danger-bg: #450a0a;
      --color-danger-border: #991b1b;
      --color-purple: #a78bfa;
      --color-purple-bg: #2e1065;
      --color-gold: #fbbf24;
      --color-gold-bg: #451a03;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--color-paper);
      color: var(--color-ink);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header#top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--color-paper-card);
      border-bottom: 1.5px solid var(--color-rule);
      box-shadow: var(--shadow-sm);
    }

    .header-main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .branding-icon {
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--color-accent-subtle);
      border: 1px solid var(--color-accent);
    }
    .branding-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .branding-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--color-success);
      color: white;
    }
    .branding-subtitle {
      font-size: 12px;
      color: var(--color-ink-muted);
      font-weight: 500;
    }

    .header-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--color-paper-subtle);
      padding: 6px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-rule);
    }
    .metric-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .metric-val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
    }
    .metric-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--color-ink-muted);
      text-transform: uppercase;
    }
    .metric-divider {
      width: 1px;
      height: 24px;
      background: var(--color-rule);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-rule);
      background: var(--color-paper-card);
      color: var(--color-ink);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .action-btn:hover {
      background: var(--color-paper-subtle);
      border-color: var(--color-ink-muted);
    }
    .action-btn.active {
      background: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }
    .action-btn.btn-study-active {
      background: var(--color-purple);
      color: white;
      border-color: var(--color-purple);
    }
    .action-btn.btn-quiz-active {
      background: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }
    .action-btn.btn-trap-active {
      background: var(--color-gold);
      color: white;
      border-color: var(--color-gold);
    }
    .action-btn.btn-calc-active {
      background: #0d9488;
      color: white;
      border-color: #0d9488;
    }

    .chapter-nav-strip {
      max-width: 1480px;
      margin: 0 auto;
      padding: 6px 24px 8px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .chapter-tab-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-rule);
      background: var(--color-paper-card);
      color: var(--color-ink-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .chapter-tab-btn:hover {
      color: var(--color-ink);
      border-color: var(--color-ink-muted);
    }
    .chapter-tab-btn.active {
      background: var(--color-accent);
      color: white;
      border-color: var(--color-accent);
    }
    .tab-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.08);
    }
    .chapter-tab-btn.active .tab-badge {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    #exam-arena {
      max-width: 1480px;
      margin: 20px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      flex: 1;
      width: 100%;
    }

    .questions-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .question-card {
      background: var(--color-paper-card);
      border: 1.5px solid var(--color-rule);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .question-card:hover {
      box-shadow: var(--shadow-md);
    }

    .q-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
    }
    .q-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .q-num-badge {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      background: var(--color-ink);
      color: var(--color-paper-card);
    }
    .q-chapter-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-accent);
      background: var(--color-accent-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-sm);
    }
    .q-exam-status-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tag-trap {
      background: var(--color-gold-bg);
      color: #b45309;
      border: 1px solid var(--color-gold);
    }
    .tag-calc {
      background: #ccfbf1;
      color: #0f766e;
      border: 1px solid #14b8a6;
    }
    .tag-official-ans {
      background: var(--color-success-bg);
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
      font-weight: 800;
    }

    .q-text {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
      color: var(--color-ink);
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 14px;
    }
    .option-btn {
      padding: 10px 14px;
      background: var(--color-paper-subtle);
      border: 1.5px solid var(--color-rule);
      border-radius: var(--radius-sm);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--color-ink);
      font-family: var(--font-body);
      transition: all 0.15s;
    }
    .option-btn:hover {
      border-color: var(--color-accent);
      background: var(--color-paper-card);
      transform: translateX(2px);
    }
    .opt-key {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 13px;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--color-paper-card);
      border: 1px solid var(--color-rule);
      flex-shrink: 0;
    }
    .opt-desc {
      flex: 1;
      line-height: 1.5;
    }

    .option-btn.opt-correct {
      background: var(--color-success-bg) !important;
      border-color: var(--color-success) !important;
      color: var(--color-success) !important;
      font-weight: 700;
    }
    .option-btn.opt-wrong {
      background: var(--color-danger-bg) !important;
      border-color: var(--color-danger) !important;
      color: var(--color-danger) !important;
      font-weight: 700;
    }
    .option-btn.opt-user-selected {
      box-shadow: 0 0 0 2px var(--color-accent);
    }

    .explanation-box {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--color-paper-subtle);
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--color-accent);
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    .explanation-box.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }
    .exp-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--color-rule);
    }
    .exp-title {
      font-weight: 800;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .exp-ans-badge {
      font-family: var(--font-mono);
      font-weight: 800;
      background: var(--color-success);
      color: white;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
    }
    .exp-body {
      white-space: pre-line;
      color: var(--color-ink);
    }
    .exp-mnemonic-banner {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--color-gold-bg);
      border: 1px solid var(--color-gold);
      color: #92400e;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #jump-sidebar {
      position: sticky;
      top: 130px;
      height: calc(100vh - 160px);
      background: var(--color-paper-card);
      border: 1.5px solid var(--color-rule);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }
    .sidebar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-rule-subtle);
    }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
    }
    .sidebar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .num-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      overflow-y: auto;
      scrollbar-width: thin;
      padding-right: 2px;
      flex: 1;
    }
    .grid-btn {
      aspect-ratio: 1;
      background: var(--color-paper-subtle);
      border: 1px solid var(--color-rule);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--color-ink-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      position: relative;
    }
    .grid-btn:hover {
      border-color: var(--color-ink);
      color: var(--color-ink);
      transform: scale(1.1);
      z-index: 2;
    }
    .grid-btn.is-trap-marker::after {
      content: "";
      position: absolute;
      top: 1px;
      right: 1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--color-gold);
    }
    .grid-btn.ans-correct {
      background: var(--color-success) !important;
      color: white !important;
      border-color: var(--color-success) !important;
    }
    .grid-btn.ans-wrong {
      background: var(--color-danger) !important;
      color: white !important;
      border-color: var(--color-danger) !important;
    }

    #scratchpad-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #scratchpad-modal.show {
      display: flex;
    }
    .scratchpad-box {
      width: 90vw;
      max-width: 960px;
      height: 80vh;
      background: var(--color-paper-card);
      border-radius: var(--radius-lg);
      border: 2px solid var(--color-rule);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .scratchpad-toolbar {
      padding: 10px 16px;
      background: var(--color-paper-subtle);
      border-bottom: 1px solid var(--color-rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .scratchpad-canvas-wrapper {
      flex: 1;
      position: relative;
      background: white;
      cursor: crosshair;
    }
    #scratchpad-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Print Optimization Stylesheet */
    @media print {
      header#top-header,
      #jump-sidebar,
      .header-actions,
      .q-meta-bar button,
      #scratchpad-modal,
      footer#main-footer {
        display: none !important;
      }
      body {
        background: white !important;
        color: black !important;
        font-size: 12pt;
      }
      #exam-arena {
        display: block !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .question-card {
        page-break-inside: avoid;
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        margin-bottom: 16px !important;
        padding: 12px !important;
      }
      .explanation-box {
        display: block !important;
        background: #f4f4f4 !important;
        border-left: 3px solid #333 !important;
      }
      .option-btn {
        border: 1px solid #ddd !important;
        background: transparent !important;
      }
      .option-btn.opt-correct {
        border: 2px solid #059669 !important;
        font-weight: bold !important;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer#main-footer {
      border-top: 1px solid var(--color-rule);
      background: var(--color-paper-card);
      text-align: center;
      padding: 16px 24px;
      font-size: 12px;
      color: var(--color-ink-muted);
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header id="top-header">
    <div class="header-main">
      <div class="header-branding">
        <div class="branding-icon">📚</div>
        <div>
          <div class="branding-title">
            第一次全真模擬考 · A 卷 100 題官方全解析與自習系統
            <span class="branding-pill">班級自習分享版</span>
          </div>
          <div class="branding-subtitle">
            中華專案管理學會第八版 SSoT 權威對齊 · 100 題逐題答案與深度解析 · 研讀/測驗雙模式
          </div>
        </div>
      </div>

      <div class="header-metrics">
        <div class="metric-col">
          <span class="metric-val" id="disp-mode-title" style="color:var(--color-purple);">📖 研讀全覽</span>
          <span class="metric-label">當前模式</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-col">
          <span class="metric-val" id="disp-progress">100 / 100</span>
          <span class="metric-label">題庫進度</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-col">
          <span class="metric-val" id="disp-score" style="color:var(--color-ink);">-</span>
          <span class="metric-label">自測得分</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-col">
          <span class="metric-val" style="color:var(--color-success);">70 分</span>
          <span class="metric-label">合格標準(PASS)</span>
        </div>
        <div class="metric-divider"></div>
        <div class="metric-col">
          <span class="metric-val" id="disp-timer">00:00:00</span>
          <span class="metric-label">自測計時</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Dual Mode Buttons -->
        <button class="action-btn btn-study-active" id="btn-mode-study" onclick="switchMainMode('STUDY')" title="直接顯示官方答案與完整解析">
          <span>📖 研讀對答案模式</span>
        </button>
        <button class="action-btn" id="btn-mode-quiz" onclick="switchMainMode('QUIZ')" title="隱藏答案，自己點選作答並計分">
          <span>✍️ 自我模擬測驗模式</span>
        </button>
        
        <!-- Filter Tools -->
        <button class="action-btn" id="btn-filter-traps" onclick="filterCategory('TRAPS')">
          <span>⚡ 16大高頻陷阱題</span>
        </button>
        <button class="action-btn" id="btn-filter-calc" onclick="filterCategory('CALC')">
          <span>🧮 10大計算題速攻</span>
        </button>
        <button class="action-btn" id="btn-filter-quiz-wrong" onclick="filterCategory('QUIZ_WRONG')" style="display:none;">
          <span>❌ 自測錯題 (<span id="disp-quiz-wrong-count">0</span>)</span>
        </button>

        <!-- Utility Buttons -->
        <button class="action-btn" id="btn-toggle-exp" onclick="toggleAllExplanations()">
          <span>💡 詳解全開</span>
        </button>
        <button class="action-btn" onclick="openScratchpad()" title="開啟數理計算白板">
          <span>🎨 演算草稿紙</span>
        </button>
        <button class="action-btn" onclick="window.print()" title="列印或另存 PDF">
          <span>🖨️ 列印/PDF</span>
        </button>
        <button class="action-btn" onclick="toggleTheme()" title="切換日夜模式">
          <span>🌓</span>

  <script>
    const examQuestions = [{"index":1,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"以下何種活動可以歸屬於專案？","options":{"A":"企業上市櫃計畫","B":"ERP系統建置","C":"教學大樓之工程","D":"以上皆是。"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.6-10。專案（Project）具有臨時性（有明確起訖時間）與獨特性（產出獨特成果）。企業上市櫃、ERP系統導入、興建教學大樓皆具備特定目標與明確時限，全數符合專案定義，故選 D。"},{"index":2,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"專案管理的知識中，硬技術與方法（Hard Skill）不包含","options":{"A":"品質確保","B":"人際關係互動","C":"時程規劃","D":"風險管控"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.14。硬技術（Hard Skill）包含時程排程（CPM/PERT）、成本估算（EVM）、品質工具與風險評估等具體方法論；人際關係互動、團隊激勵、溝通與衝突解決屬於「軟技術（Soft Skill）」，故選 B。"},{"index":3,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"下列何者不是「專案」(Project)的特性？","options":{"A":"帶來商業價值","B":"任務的特殊性","C":"時間的明確性","D":"利益的關聯性"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.7。專案三大根本特性為：臨時性（明確起訖時間）、獨特性（特殊任務產出）與漸進明細（帶來組織商業價值）。「利益的關聯性」並非專案的核心定義屬性，故選 D。"},{"index":4,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"在發展時程時會用到那一種工具來協助壓縮時程？","options":{"A":"資源撫平","B":"計畫評核術 (Program Evaluation & Review Technique, PERT)","C":"趕工縮程 (Crashing)","D":"要徑法 (Critical Path Method, CPM)"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.201。時程壓縮兩大核心技術為「趕工縮程 (Crashing)」與「快速跟進 (Fast Tracking)」。資源撫平往往會延長時程；PERT 與 CPM 是排程分析工具，非直接壓縮技術。故選 C。"},{"index":5,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"下列哪一項專案文件能夠最有效的協助專案團隊定義及發現風險事項？","options":{"A":"專案章程 (Project Charter)","B":"工作分解結構 (WBS)","C":"專案範疇聲明 (Scope Statement)","D":"甘特圖 (Gantt Chart)"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.157。WBS 將專案全部工作逐層細分至工作包，每一工作包皆為具體的責任單元，團隊能透過檢視各工作包最有效地識別潛在技術與執行風險（風險分解結構 RBS 亦常與 WBS 映射），故選 B。"},{"index":6,"chapter":"CH10","chapterTitle":"CH10 專案終結","q":"專案在進行概念發展時，經過市場分析、風險分析及技術可行性分析後，認為不可行，並透過一定的決策過程將它終結，稱為甚麼？","options":{"A":"專案中止 (Termination)","B":"專案取消 (Cancellation)","C":"專案結束 (Closure)","D":"專案延遲 (Delay)"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.380 打星重點。專案終結三種類型：(1) 專案取消：在概念/規劃階段經評估不可行而提前撤案；(2) 專案中止：執行中因政策或缺失被迫停止；(3) 專案結束：目標達成圓滿收尾。本題處於概念期尚未正式執行，故為專案取消 (B)。"},{"index":7,"chapter":"CH10","chapterTitle":"CH10 專案終結","q":"下列有關「專案中止」(Project Termination)的敘述，何者不正確？","options":{"A":"當專案因「政策性中止」時，買方需依契約賠償對賣方所造成的一切損失","B":"當專案因「缺失性中止」時，賣方需依契約賠償對買方所造成的一切損失","C":"當新技術、新產品出現時，可能會使專案中止","D":"風險太大不是專案中止的原因"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.380-384。專案若面臨不可承受之巨大風險（如法律變更、技術徹底不可行、財務崩盤），正是觸發專案中止的關鍵原因之一。「風險太大不是中止原因」敘述明顯錯誤，故選 D。"},{"index":8,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"某專案的「時程績效指標」(SPI)是 1.0，「成本績效指標」(CPI)是 0.8，此情況說明專案處於何種狀態？","options":{"A":"進度落後，成本超支","B":"進度超前，成本盈餘","C":"進度準時，成本超支","D":"進度準時，成本盈餘"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.350。SPI = EV/PV = 1.0 代表實獲進度等於規劃進度（進度準時）；CPI = EV/AC = 0.8 < 1 代表每花 1 元僅獲得 0.8 元價值（成本超支）。故為進度準時，成本超支 (C)。"},{"index":9,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"下列何者不是「績效指標」的特性？","options":{"A":"可預測性","B":"明確性","C":"可衡量性","D":"可驗證性"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.342。績效指標（Performance Metric）必須具備具體明確（Specific）、可量化衡量（Measurable）與可查核驗證（Verifiable）之特性；指標本身是用來衡量現狀與歷史偏差，並非「指標具可預測性」，故選 A。"},{"index":10,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"下列何者不是專案「監視與管制過程組」主要的過程？","options":{"A":"監視與管制專案工作","B":"進行整合變更管制","C":"管制範疇","D":"規劃範疇"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.23 表 1-3【49 過程配適矩陣】。規劃範疇（Plan Scope Management）屬於「規劃過程組」，而 A、B、C 均為標準監視與管制過程組（Monitoring & Controlling），故選 D。"},{"index":11,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"「A專案」原有 5 名專案團隊成員，後來因專案需求又增加 3 位成員，請問後來的溝通管道比原的增加幾條？","options":{"A":"28","B":"26","C":"18","D":"14"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.305 雙星必考公式 $C = n(n-1)/2$。\n1. 原有 5 人：$C_1 = 5 \\times 4 / 2 = 10$ 條；\n2. 增加 3 人變 8 人：$C_2 = 8 \\times 7 / 2 = 28$ 條；\n3. 增加管道數：$28 - 10 = 18$ 條。故選 C。"},{"index":12,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案執行各項任務及工作時，是依據下列哪一項文件？","options":{"A":"工作分解結構 (Work Breakdown Structure, WBS)","B":"專案管理計畫書 (Project Management Plan)","C":"工作說明書 (Statement of Work, SOW)","D":"專案章程 (Project Charter)"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.142。專案管理計畫書是整合所有 15 大子計畫與三大基準的最高綱領文件，指導與管理專案執行過程唯一的綜合指導依據，故選 B。"},{"index":13,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"下列何者是指「當資源(如資本、勞力、技術及時間等)有改變目前用途，投入到另一個的可能性時，其所獲取(或放棄)的利益」","options":{"A":"會重複發生的成本 (Recurring Cost)","B":"不會重複發生的成本 (Nonrecurring Cost)","C":"機會成本 (Opportunity Cost)","D":"沉沒成本 (Sunk Cost)"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.117。將有限資源投入於某一方案而放棄其他替代方案所能獲得的最大潛在利益，稱為「機會成本 (Opportunity Cost)」，故選 C。"},{"index":14,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"在進行成本估算時，參考過去相似的專案所作的成本估算方法，稱為甚麼？","options":{"A":"專家判斷法 (Expert Judgment)","B":"類比估算法 (Analogous Estimating)","C":"參數估算法 (Parametric Estimating)","D":"成本工程估算法 (Cost Engineering)"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.220 表 6-1。利用過去類似專案之實際成本作為基礎進行比照推算的方法，稱為「類比估算法（Top-Down 由上而下）」，速度最快但精度粗略，故選 B。"},{"index":15,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"在大型專案因為預算範圍廣泛且複雜，當專案進行時，所花費的實際成本即使超出預算成本，亦很難快速的指出超支的來源，為了克服上述問題，將複雜的專案預算分解成更小的預算項目，稱之為：","options":{"A":"成本單元","B":"成本分解","C":"工作分解結構","D":"管制帳戶"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.228 圖 6-7。管制帳戶（Control Account）是專案成本與進度管制的最高綜合單元，在此層級將預算分解並綁定特定負責人與工作包，能精準鎖定超支來源，故選 D。"},{"index":16,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"下列哪一種活動的關係是基於特殊專業考量而決定的關係？","options":{"A":"硬性依存關係 (Hard Dependency)","B":"刻意依存關係 (Discretionary Dependency)","C":"強制依存關係 (Mandatory Dependency)","D":"外部依存關係 (External Dependency)"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.191。刻意依存關係（Discretionary Dependency，又稱軟邏輯 Soft Logic、偏好依存）是基於專案最佳實務、團隊偏好或特殊專業考量所設定之順序，非物理或合約強制限制，故選 B。"},{"index":17,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"活動 A(工期 6 天)開始工作的日期為星期二早上，後續活動為活動 B(工期 5 天)，A、B二者關係為完成--開始，且活動 B 延遲(Lag)1天開始，假設星期六，日不工作，下列何者為真？","options":{"A":"活動 B 完成日期為星期二下午","B":"活動 B 完成日期為星期三下午","C":"活動 B 完成日期為星期四下午","D":"活動 B 完成日期為星期五下午"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.193 離散工作天排程推算：\n1. 活動 A (6天)：週二早開始 -> 經歷週二、週三、週四、週五、下週一、下週二下午完工 (共6天)；\n2. Lag 1 天：下週三為緩衝等待日；\n3. 活動 B (5天)：下週四早上開工 -> 經歷週四(1)、週五(2)、跳過週末六日、第三週週一(3)、週二(4)、週三(5)下午完工！故選 B。"},{"index":18,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"「設計一套能讓專案據以執行的計畫，使能達成專案所設定之目標」指的是下列哪一過程？","options":{"A":"起始過程","B":"規劃過程","C":"執行過程","D":"結束過程"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.141。規劃過程組（Planning Process Group）的核心宗旨就是界定範疇、細化目標，並制定出一套完整具體、團隊得以據以執行的行動方案（專案管理計畫書），故選 B。"},{"index":19,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"在專案規劃時最初的工作是下列哪一項？","options":{"A":"建立專案進度","B":"辨識專案風險","C":"規劃專案範疇","D":"預估專案預算"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.143 圖 4-1 規劃十步驟。進入規劃階段，必須「先有範疇（先知道要做什麼），才能算時程與成本」！規劃的第一步正是規劃專案範疇，故選 C。"},{"index":20,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案經理在會議上與專案團隊討論專案目標、需求、可交付成果等議題，請問此時是屬於專案的哪一個階段","options":{"A":"起始階段","B":"規劃階段","C":"執行階段","D":"監視與管制階段"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.142-145。專案經理與團隊深入盤點具體目標、細化需求、界定可交付成果邊界，皆屬於「規劃階段 (Planning)」之範疇界定作業，故選 B。"},{"index":21,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"下列何項不屬於專案經理的基本職責？","options":{"A":"提供專案管理者在財務上所需要的協助","B":"規劃專案活動、任務及最終結果，包含分解、排程、預算、協調任務及分配資源","C":"溝通及整合功能管理者、合約商、顧問、使用者及上層管理者","D":"處理危機及衝突"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.84。專案經理（PM）是專案的指揮官與整合者，負責目標規劃、跨部門協調與危機處理；「提供財務協助」是發起人/贊助者 (Sponsor) 或財務部門的職責，非 PM 基本職責，故選 A。"},{"index":22,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"發展工作分解結構(Work Breakdown Structure, WBS)的必要文件為何？","options":{"A":"工作條款 (Statement of Work, SOW)","B":"工作分解結構範本","C":"合約","D":"專案核准書"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.156。發展 WBS 必須依據工作說明書／工作條款（SOW），SOW 清楚定義了專案應交付的成果與工作要求，是 WBS 展開分解的直接輸入依據，故選 A。"},{"index":23,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"美國國家太空總署(NASA)太空船專案比原來的成本估計超過 4-5 倍之多，主要是因為何者原因？","options":{"A":"不確定性以及缺乏準確的資訊","B":"環境中經濟或社會變數的影響","C":"工作無效率、欠缺有效的溝通及管制","D":"預估者的過度自信"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.224 成本擴大 7 大原因實例探討。尖端探索型航太專案在啟動初期技術前所未見，具備高度「不確定性以及缺乏準確的歷史資訊」，導致初始估算大幅偏離實際支出，故選 A。"},{"index":24,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"活動 A(工期 5 天)開始工作的日期為星期二早上，後續活動為活動 B(工期 3 天)，而且二者關係為完成-開始並且延遲(LAG)1 天，假設星期六，日不工作，以下何者為真：","options":{"A":"專案結束於星期二下午","B":"專案結束於星期三下午","C":"專案結束於星期四下午","D":"專案結束於星期五下午"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.193 離散工作天推算：\n1. 活動 A (5天)：週二早開始 -> 經歷週二(1)、週三(2)、週四(3)、週五(4)、跳過週末、下週一(5)下午完工；\n2. Lag 1 天：下週二為延遲等待日；\n3. 活動 B (3天)：下週三早開工 -> 經歷下週三(1)、週四(2)、週五(3)下午完工！故選 D。"},{"index":25,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"專案成本估計發展過程中，在下列那個階段誤差最大？","options":{"A":"概念階段","B":"定義階段","C":"結束階段","D":"執行階段"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.218 生命週期三階段估算精度。概念階段（Concept）所做之粗估（ROM 量級估算）誤差範圍高達 -25% ~ +75%（甚至 -50% ~ +100%），為生命週期中誤差最大之時期，故選 A。"},{"index":26,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"專案管理的知識中，軟技術(Soft Skill)方面的要求，不含下列何者？","options":{"A":"決策的分析與下達","B":"人力資源的運用及專案領導的藝術","C":"對人際關係的互動","D":"時程規劃"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.14。時程規劃（甘特圖、CPM 網路圖演算法）屬於典型的數學與工具硬技術（Hard Skill），其餘皆為管理與人際軟技術，故選 D。"},{"index":27,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"下列哪一項不是「敏捷宣言」(Agile Manifesto)的 4 個價值觀？","options":{"A":"流程與工具勝於個人與互動","B":"可用的軟體勝於複雜的文件","C":"與客戶協同合作勝於合約談判","D":"回應變更勝於遵循計畫"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.26。敏捷宣言第一條核心價值為「個人與互動 勝於 流程與工具」，A 選項剛好反轉顛倒，故選 A。"},{"index":28,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"下列有關「專案型組織」(Projectized Organization)的敘述，何者不正確？","options":{"A":"專案型組織是暫時性的組織","B":"專案型組織中專案經理能全權管理專案，分配專案所有資源","C":"專案型組織中成員多半是兼職的","D":"當專案結束時，專案團隊即會解散"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.66。在專案型組織中，專案團隊成員全數為「全職 (Full-time)」投入該專案，並無原職能部門歸屬（結案時有 No-home 無家可歸感）。因此宣稱成員多半兼職是錯誤的，選 C。"},{"index":29,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"下列何者是專案「起始過程組」(Project Initiating Process Group)的重要產出？","options":{"A":"專案管理計畫書 (Project Management Plan)","B":"工作說明書 (Statement of Work, SOW)","C":"專案章程 (Project Charter)","D":"責任分派矩陣 (Responsibility Assignment Matrix, RAM)"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.108。起始過程組僅有兩大產出：(1) 發展專案章程產出的「專案章程」；(2) 辨識利害關係人產出的「利害關係人登錄表」。故選 C。"},{"index":30,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"下列何者核准「專案章程」(Project Charter)","options":{"A":"專案贊助者 (Sponsor)","B":"專案經理 (Project Manager)","C":"所有利害關係人 (Stakeholders)","D":"顧客 (Customer)"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.128 簽署鐵律。專案章程是由「專案發起人／贊助者 (Sponsor)」正式發布並簽署核准的法律文件，賦予 PM 動用組織資源的法定權力。PM 絕無權自己核准章程！故選 A。"},{"index":31,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"下列有關「矩陣型組織」(Matrix Organization)的敘述，何者不正確？","options":{"A":"部門經理提供必須的技術協商，諮詢及支援","B":"專案經理有較高的權力","C":"專案經理整合不同功能領域的資源","D":"專案經理必須和部門經理相互協調"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.58。矩陣組織中 PM 與職能經理分享權力，甚至在弱矩陣與平衡矩陣中 PM 權力偏低或均等，不可籠統稱專案經理有較高權力，故 B 不正確。"},{"index":32,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"以下何種狀況是造成客戶對專案產出不滿的主要原因？","options":{"A":"成本超支","B":"範疇定義不清","C":"時程落後","D":"專案品質不良"},"ans":"D","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"易混淆陷阱題","mnemonic":"成果瑕疵難下燕，品質不良客戶怨！","exp":"【深度剖析】：客戶最終使用的是交付成果本身。成本超支是專案內部或出資方問題，時程稍延誤客戶或可包容；但若最終交付標的充滿瑕疵缺陷，即「專案品質不良」，是造成客戶對專案成果不滿的最直接、最主要原因！\n【秒殺口訣】：成果瑕疵難下燕，品質不良客戶怨！"},{"index":33,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"以下何者不是專案管理辦公室(PMO)的主要用途及目的？","options":{"A":"確保各專案符合組織策略目標","B":"管理及優化組織共用資源","C":"專案成本及時程管控","D":"開發及管理組織流程資產"},"ans":"C","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"職能邊界題","mnemonic":"PMO 管標準與資源，專案時程成本交給 PM！","exp":"【深度剖析】：個別專案的日常排程、成本估算與進度管制是「專案經理 (PM)」的本職工作！PMO 是組織級機構，主要負責跨專案資源協調、流程資產開發維護、方法論建立及對齊策略目標，並不親自干涉個別專案日常成本與時程管制。\n【秒殺口訣】：PMO 管標準與資源，專案時程成本交給 PM！"},{"index":34,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"專案經理應該在下列哪一個階段開始識別利害關係人期望？","options":{"A":"啟始 (Initial)","B":"規劃 (Plan)","C":"執行 (Execute)","D":"監控 (Control)"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.108。利害關係人辨識（13.1）屬於「起始過程組」，在專案一被核准起始時就必須立刻展開辨識並管理其期望，故選 A。"},{"index":35,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"PM發現產品有缺陷，但是PM知道客戶沒有技術能力發現該缺陷，PM該如何？","options":{"A":"密而不宣","B":"通知客戶延遲交付","C":"與客戶討論此缺陷","D":"記錄並防止未來不發生相同錯誤"},"ans":"C","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"職業道德題","mnemonic":"客戶不懂不欺瞞，誠信討論共擔當！","exp":"【深度剖析】：這是大考經典的職業道德與誠信（Honesty & Transparency）考題！即便客戶不懂技術看不出來，PM 也絕不能隱瞞或擅自延遲，必須主動向客戶據實陳述並共同研商修復方案與對策。\n【秒殺口訣】：客戶不懂不欺瞞，誠信討論共擔當！"},{"index":36,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"對於一項六個月前開始的兩年期專案，績效衡量基準的主要資料來源是：","options":{"A":"專案管理計畫","B":"進度報告","C":"風險登記冊","D":"專案章程"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.342。所有績效衡量基準（Performance Measurement Baseline, PMB，涵蓋範疇基準、時程基準、成本基準）全數收錄於「專案管理計畫書」之中，故選 A。"},{"index":37,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"下列描述的權責狀況，哪一項不可能出現在平衡型矩陣組織中？","options":{"A":"專案經理為全職的任用","B":"專案經理需與功能經理協調專案成員調派","C":"專案經理及功能經理共有預算決定權","D":"專案經理有完全預算決定權"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.60。在平衡型矩陣中，專案經理與職能經理平分秋色、共同協調預算；只有在「專案型組織」或極高強矩陣中 PM 才可能擁有完全預算決定權，故 D 不可能出現。"},{"index":38,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案經理正處於蒐集需求，估算活動所需資源的狀況，請問他正在執行專案管理的哪一個流程群組？","options":{"A":"起始 (Initial)","B":"規劃 (Plan)","C":"執行 (Execute)","D":"監控 (Control)"},"ans":"B","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"過程組歸屬題","mnemonic":"起始只有章程和關係人，需求資源全在規劃！","exp":"【深度剖析】：起始過程組只有 2 個過程：發展專案章程 (4.1) 與 辨識利害關係人 (13.1)。「蒐集需求 (5.2)」與「估算活動資源 (9.2)」全數歸屬於「規劃過程組 (Planning)」！\n【秒殺口訣】：起始只有章程和關係人，需求資源全在規劃！"},{"index":39,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案經理正與已有詳細需求規格的客戶見面，請問專案經理目前正在做什麼？","options":{"A":"蒐集需求 (Collect Requirements)","B":"定義範疇 (Define Scope)","C":"發展專案章程 (Develop project charter)","D":"驗證範疇 (Verify Scope)"},"ans":"A","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"範疇規劃邊界題","mnemonic":"面對客戶聽規格是蒐集需求，內部收斂邊界才叫定義範疇！","exp":"【深度剖析】：專案經理直接與客戶面對面獲取並討論規格細節，這是「蒐集需求」的訪談技巧；獲取客戶需求後，內部進行篩選、界定做與不做的邊界，才稱為「定義範疇」。\n【秒殺口訣】：面對客戶聽規格是蒐集需求，內部收斂邊界才叫定義範疇！"},{"index":40,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"德爾菲法(Delphi Method)是屬於哪一種成本估算技術？","options":{"A":"類比估算法","B":"參數估算法","C":"專家判斷","D":"三點估算法"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.220。德爾菲法（Delphi Technique）是一種背對背、匿名多輪反饋以尋求專家共識的技術，本質屬於「專家判斷法 (Expert Judgment)」，故選 C。"},{"index":41,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"專案的 Schedule Variance = -200，且 Cost Performance Index = 1.08，表示目前狀態為？","options":{"A":"進度超前，在預算內","B":"進度落後，超出預算","C":"進度超前，超出預算","D":"進度落後，在預算內"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.348。時程變異 $SV = EV - PV = -200 < 0$ 代表進度落後；成本績效指標 $CPI = EV / AC = 1.08 > 1$ 代表成本節省（在預算內）。故選 D。"},{"index":42,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"「交付標的」是有形的，可衡量的且可驗證的專案工作產出，它可能是以下何種形式表現？","options":{"A":"產品","B":"服務","C":"文件或訓練","D":"以上皆是"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.147。可交付成果（Deliverables）之形態多元，可為實體硬體產品、可為無形服務能力、亦可為軟體代碼、使用手冊文件或人員培訓作業，故選 D。"},{"index":43,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"將專案交付項目分解成較小的項目，以便指派資源的工作是為？","options":{"A":"活動定義","B":"專案規劃","C":"工作分解結構","D":"交付標的定義"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.155。將專案交付標的與總體工作層層細化分解成較小、易於管理指派的單元，正是建立「工作分解結構 (WBS)」的定義，故選 C。"},{"index":44,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"在進行成本估計時，成本工程估計法(Cost Engineering)的做法為","options":{"A":"直覺的估計方式","B":"參考過去類似的案件所做的成本估計方法","C":"源自於實證或數理關係之估計方法","D":"在工作包或任務層級的個別成本種類的細部成本分析方法"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.220 表 6-1。成本工程法（Cost Engineering，即由下而上估算 Bottom-up）是針對 WBS 底層之個別工作包或活動，逐一計算工料機細部成本並向上加總，精度最高，故選 D。"},{"index":45,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"「實獲值管理」重要的元素中，「實際成本」(Actual Cost 是指 AC =","options":{"A":"到目前為止有多少工作應完成","B":"已完成工作實際花費的成本","C":"原計畫的工作總成本","D":"預估完工總成本"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.346。實際成本（Actual Cost, AC）即為執行該項已完成或進行中工作所實際發生並記錄之總支出成本，故選 B。"},{"index":46,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"企業在專案管理中常常不能達成全部可能目標的原因是什麼？","options":{"A":"認為專案管理只需要主動性","B":"缺乏管理層的承諾和支持","C":"認為這是公司稽核部門的職責","D":"缺少職能管理控制"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.12。專案失敗或目標未達成的首要致命因素，統計上最常歸咎於「缺乏高階管理層持續的承諾與資源支持」，故選 B。"},{"index":47,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"專案時程估算時，某活動最快可在 10 天完成，最長會費時 22 天，而最有可能 15 天就可完成，該活動期望值四捨五入為？","options":{"A":"14 天","B":"15 天","C":"16 天","D":"17 天"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.203 PERT 貝他分配期望值公式：\n$$E = \\frac{O + 4M + P}{6} = \\frac{10 + 4 \\times 15 + 22}{6} = \\frac{92}{6} \\approx 15.33 \\text{ 天}$$\n四捨五入取整數為 15 天，故選 B。"},{"index":48,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"下列哪一個工具可以讓 PM 瞭解專案進度？","options":{"A":"里程碑圖","B":"甘特圖","C":"資源撫平","D":"專案管理資訊系統"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.195 表 5-1。甘特圖（Gantt Chart）能清晰展示各活動之起訖時間與進度百分比，是專案經理（PM）掌控日常進度的最佳工具（里程碑圖適合高階主管），故選 B。"},{"index":49,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"「專案成本會計系統」(PCAS)強調成本與專案進度、工作績效等的相關成本之關聯性，該系統亦允能追蹤、控制專案的時程及工作進度，當其結合了其他專案規劃、控制及報告的功能時，則可視其為：","options":{"A":"專案管理資訊系統","B":"專案流程追蹤系統","C":"專案報告控制系統","D":"專案資源資訊系統"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.230。PCAS 整合了規劃、排程、管制與報告功能後，即形成完整的專案管理資訊系統（PMIS, Project Management Information System），故選 A。"},{"index":50,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"某專案團員向你抱怨“我無法先進行活動 B 的工作，除非 A 的工作先完成”，活動 A 及活動 B 屬於那一種關係？","options":{"A":"刻意依存關係 (Discretionary)","B":"強制依存關係 (Mandatory)","C":"外部依存關係 (External)","D":"優先的依存關係 (Preferential)"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.190。受限於物理必然性或合約限制，無法逾越之「硬邏輯 (Hard Logic)」，屬於強制依存關係（Mandatory Dependency），故選 B。"},{"index":51,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"溝通需求分析的目的是？","options":{"A":"建立利害關係人網絡圖","B":"瞭解利害關係人的需求","C":"按照計畫提供專案資訊","D":"正確並及時發佈績效報告"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.304。溝通需求分析（Communication Requirements Analysis）之宗旨，在於精確掌握各利害關係人對資訊內容、頻率、格式與管道的具體需求，故選 B。"},{"index":52,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"公司程序要求建立專案管理經驗分享文件，專案管理經驗分享(Lesson Learned)的最大用途？","options":{"A":"告知團隊有關專案經理的行為","B":"作為現有專案的規劃紀錄","C":"作為未來專案參考的歷史紀錄","D":"告知團隊有關專案管理計畫"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.314。經驗學習（Lessons Learned）歸入組織流程資產（OPA），其核心價值是為組織與「未來後續專案」提供寶貴歷史經驗借鏡，避免重複犯錯，故選 C。"},{"index":53,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"您剛被指派參與一個大型機台建置專案，這個團隊是由 6 名供應商與 21 名公司內部成員組成，若您想瞭解專案中各成員分別負責什麼？可以從哪裡找到這個資訊？","options":{"A":"專案組織圖","B":"資源直方圖","C":"責任分派矩陣","D":"長條圖"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.172。責任分派矩陣（RAM / RACI）將 WBS 工作包與 OBS 人員交叉對應，明確定義各成員與供應商之職責，故選 C。"},{"index":54,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"敏捷團隊成員中，由傳統的專案經理轉型而來的角色是？","options":{"A":"開發團隊","B":"產品負責人","C":"團隊測試者","D":"敏捷教練"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.29。在 Scrum 敏捷框架中，傳統專案經理通常轉型為僕人式領導的「敏捷教練 (Scrum Master / Agile Coach)」，負責排除團隊障礙與輔導流程，故選 D。"},{"index":55,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"Tina 發現很難準確估計風險對成本的影響，她應該依循以下哪種方法評估？","options":{"A":"定性基礎 (qualitative basis)","B":"數字基礎 (numerical basis)","C":"定量基礎 (quantitative basis)","D":"計量經濟 (econometric basis)"},"ans":"A","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"風險評估方法題","mnemonic":"精準數值算不出，定性矩陣排先後！","exp":"【深度剖析】：當風險缺乏精準數據無法量化計算時，標準作業程序是採用「定性基礎 (qualitative basis)」評估！透過發生機率與衝擊等級矩陣（如高/中/低）迅速排序並制定因應措施。\n【秒殺口訣】：精準數值算不出，定性矩陣排先後！"},{"index":56,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"當客戶提出變更時，往往可能增大風險，此時，應該先做什麼？","options":{"A":"與團隊一起分析變更的影響","B":"將變更帶來的影響告知客戶","C":"將該風險的預期貨幣值納入新的成本估算","D":"變更風險應對計畫"},"ans":"A","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"變更控制鐵律題","mnemonic":"客戶變更莫慌張，先找團隊算影響！","exp":"【深度剖析】：變更管制的黃金第一步永遠是「內部評估影響 (Analyze Impact)」！尚未與團隊詳細評估時程、成本與風險衝擊之前，手頭根本沒有精確影響數據，絕不能直接找客戶答覆。\n【秒殺口訣】：客戶變更莫慌張，先找團隊算影響！"},{"index":57,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"在何種情況下，專案目標得以明確：","options":{"A":"由最高主管進行溝通","B":"由專案團隊成員制定與溝通","C":"可以量化","D":"能向所有利害關係人宣達"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.126 SMART 原則。專案目標要能清晰無歧義，「可以具體量化 (Measurable)」是界定目標是否明確的最核心關鍵，故選 C。"},{"index":58,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"以下何者不是時程發展的工具？","options":{"A":"要徑法 (Critical Path Method, CPM)","B":"計畫評核術 (PERT)","C":"箭頭圖示法 (Activity On Arrow, AOA)","D":"組織分解結構 (OBS)"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.198。組織分解結構（OBS）是組織管理工具（用以配合 WBS 分派責任）；CPM、PERT、AOA 全數為時程發展分析工具，故選 D。"},{"index":59,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"下列哪一種技術可以用來預測活動時程的彈性？","options":{"A":"要徑法 (Critical Path Method, CPM)","B":"計畫評核術 (PERT)","C":"箭頭圖示法 (Activity On Arrow, AOA)","D":"節點圖示法 (Activity On Node, AON)"},"ans":"A","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"時程核心術語題","mnemonic":"算浮時看要徑，彈性大小全靠 CPM！","exp":"【深度剖析】：時程的彈性在專案管理中指的就是「浮時 (Float / Slack)」！只有「要徑法 (CPM)」會進行正向推導與逆向推導（ES/EF/LS/LF），計算出總浮時與自由浮時，用以預測各活動時程的彈性大小。\n【秒殺口訣】：算浮時看要徑，彈性大小全靠 CPM！"},{"index":60,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"以下對要徑(Critical Path)的敘述何者不正確？","options":{"A":"專案由開始到結束花費時間最長的活動路徑","B":"專案至少花費的時間","C":"一個專案可擁有多條要徑","D":"縮短要徑上的活動，對專案不會影響"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.198。要徑決定了專案最短完工工期，縮短要徑上的活動會直接縮短專案總時程，絕非「不會影響」，故 D 錯誤。"},{"index":61,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"二次風險(Secondary Risk)是指？","options":{"A":"定量分析的剩餘風險","B":"合約條款的殘留風險","C":"風險應對造成的風險","D":"以上皆非"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.370。因實施某項風險因應策略（Response Measure）而直接衍生催生的全新風險，定義為「二次風險 (Secondary Risk)」，故選 C。"},{"index":62,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"哪種組織型式，專案經理的權力最少？","options":{"A":"純專案型組織","B":"平衡矩陣型組織","C":"功能型組織","D":"強矩陣型組織"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.54 表 2-1。在傳統功能型組織（Functional Organization）中，部門主管掌握所有大權，專案經理權力近乎為零（極少或無），故選 C。"},{"index":63,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"專案經理的權力依序遞增，何者正確？","options":{"A":"功能型->弱矩陣->平衡矩陣->強矩陣->專案型","B":"弱矩陣->功能型->平衡矩陣->強矩陣->專案型","C":"平衡矩陣->弱矩陣->功能型->強矩陣->專案型","D":"專案型->弱矩陣->平衡矩陣->強矩陣->功能型"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.54 組織光譜：功能型 (0%) $\\rightarrow$ 弱矩陣 (低) $\\rightarrow$ 平衡矩陣 (中) $\\rightarrow$ 強矩陣 (中高) $\\rightarrow$ 專案型 (全權 100%)，故選 A。"},{"index":64,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"某專案如下，活動 A(工期 5 天)專案啟動後開始，活動 B(工期 6 天)專案啟動後開始，活動 C(工期 4 天)在 A 和 B 都結束後開始，活動 D(工期 3 天)在 A 和 C 都結束後開始，活動 E(工期 5 天)在 B 和 C 都結束後開始，則要徑長為？","options":{"A":"45 天","B":"36 天","C":"25 天","D":"15 天"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.199 網路圖手算：\n- 進入 C 需等 A(5) 與 B(6)，取大值為 6 天；\n- 路徑 1：B(6) -> C(4) -> D(3) = 13 天；\n- 路徑 2：B(6) -> C(4) -> E(5) = 15 天；\n- 其餘路徑皆小於 15 天。最長路徑長度為 15 天，故選 D。"},{"index":65,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"續前題，要徑有幾條？","options":{"A":"一條","B":"二條","C":"三條","D":"四條"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：延續第 64 題計算，路徑長達 15 天者僅有 B -> C -> E 單獨一條路徑，故要徑數為一條 (A)。"},{"index":66,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"PV=900, EV=600, AC=1200, CPI=?","options":{"A":"0.75","B":"0.5","C":"0.35","D":"以上皆非"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":true,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.349。成本績效指標公式：$$CPI = \\frac{EV}{AC} = \\frac{600}{1200} = 0.5$$故選 B。"},{"index":67,"chapter":"CH09","chapterTitle":"CH09 專案監視與管制","q":"客戶提出變更要求，專案經理的較佳做法是？","options":{"A":"評估變更的影響","B":"為了客戶關係接受變更","C":"為了專案進度拒絕變更","D":"以上皆是"},"ans":"A","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"變更控制盲從與討好心理","mnemonic":"變更來臨莫盲從：不迎合、不拒絕，第一步必「評估衝擊」！","exp":"【正解依據】：課本 p.360 整合變更管制 SOP。接獲客戶變更要求時，專案經理的首要之務是「評估變更對專案範疇、時程、成本與品質的綜合影響 (Impact Analysis)」，再依權限或提報 CCB 決策。\n【實戰失分陷阱】：實體試卷選 D (以上皆是)。專案經理絕不能為了迎合客戶關係而無條件接受變更（易導致範疇潛變與超支），也不能一味為了維持進度而武斷直接拒絕，故 B、C 均為管理大忌，絕不可選 D！切記：面對變更，「評估衝擊」是唯一不可動搖之黃金準則！"},{"index":68,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"估計專案的時間和成本時最好依據？","options":{"A":"專家意見","B":"歷史資料","C":"專業訓練","D":"以上皆是"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.202。估算時應多方整合專家判斷經驗、歷史數據庫資料與專業工程訓練方法，故選 D。"},{"index":69,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"在進行工作分解時，專案經理應：","options":{"A":"確認專案的主要可交付成果","B":"再具體針對每一個可交付成果，決定能否進行","C":"拆解後，驗證分解的正確性","D":"以上皆是"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.158。WBS 分解流程包含識別主要交付物、逐層展開評估細節、並依 100% 原則驗證分解正確性，故選 D。"},{"index":70,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"專案的臨時性是指：","options":{"A":"專案工時長短","B":"每一個專案都有確定的開始和結束時間","C":"任務將在未來某個不確定的時間結束","D":"專案可在何時被取消"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.7。臨時性（Temporary）絕非指工期短暫，而是指具有明確定義的開始時間點與結束時間點，故選 B。"},{"index":71,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"進行成本估計時，若由專家所估計根據其企業經驗，提供一些合理的建議，它是一種直覺的估計方式，此技術之稱為：","options":{"A":"專家意見法","B":"類推估計法","C":"參數估計法","D":"成本工程估計法"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.219。由資深專家憑藉過去直覺與行業專業經驗提出之估算，稱為「專家意見法 (Expert Judgment)」，故選 A。"},{"index":72,"chapter":"CH06","chapterTitle":"CH06 專案成本與採購規劃","q":"「專案成本會計系統」(PCAS) 的功能包括：\n(1) 強調成本與專案進度、績效等的相關成本之關聯性。\n(2) 允許能追蹤、控制專案的時程及工作。\n(3) 專案範疇管理。\n(4) 專案排程與報告。","options":{"A":"(1)(3)","B":"(1)(2)","C":"(1)(2)(3)","D":"全部皆是"},"ans":"B","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"系統功能邊界題","mnemonic":"PCAS 雙核心：成本關聯 + 工作追蹤！","exp":"【深度剖析】：課本 p.240 明訂：專案成本會計系統 (PCAS) 兩大核心功能在於「(1) 強調成本與專案進度、績效之關聯」以及「(2) 允許追蹤控制時程及工作」。它並非範疇管理工具（範疇歸屬於 WBS 字典），故選 (1)(2) (B)。\n【秒殺口訣】：PCAS 雙核心：成本關聯 + 工作追蹤！"},{"index":73,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"在專案計劃書 (Project Plan) 的那一部份出現「里程碑」的定義？","options":{"A":"工作條款","B":"專案時程","C":"預算規劃","D":"風險管理"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.194。里程碑（Milestone，工期為 0 的重要檢核點）明訂於時程管理計畫書與專案時程章節之中，故選 B。"},{"index":74,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"「敏捷宣言」(Agile Manifesto)是在哪一年發布的？","options":{"A":"1996 年","B":"2001 年","C":"2008 年","D":"2011 年"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.25。17 位軟體專家於 2001 年 2 月在美國猶他州雪鳥滑雪勝地簽署並正式發布敏捷宣言，故選 B。"},{"index":75,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"下列何者是專案技術層面的最佳溝通工具？","options":{"A":"專案章程 (Project Charter)","B":"專案範疇聲明 (Scope Statement)","C":"工作分解結構 (WBS)","D":"專案成效報告"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.157。WBS 清晰拆解交付物技術層級與工作包，是技術團隊、工程師與管理階層之間溝通專案技術範疇的最佳工具，故選 C。"},{"index":76,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"責任分派矩陣 (Responsibility Assignment Matrix, 簡稱 RAM) 是用來表示那些關係？","options":{"A":"專案關係人與專案里程碑的關係","B":"專案的工作分解結構(WBS)和專案組織的關係","C":"專案的成本和專案組織的關係","D":"專案的成本和專案關係人的關係"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.172。RAM 矩陣正是展示 WBS 工作包與 OBS 組織人員之間指派與權責對應關係，故選 B。"},{"index":77,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案計劃書 (Project Plan) 中與專案經理最有關的內容為何？","options":{"A":"專案經理的學經歷","B":"專案成員的學經歷","C":"績效如何評估的說明","D":"專案的里程碑"},"ans":"C","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"角色與計畫書關係題","mnemonic":"里程碑是專案關卡，績效評估攸關 PM 職責！","exp":"【深度剖析】：里程碑是專案時程的檢核點（偏向專案本體）；而在計畫書中說明「績效如何被評估與衡量」，直接界定了專案成功的標準以及專案經理的管理績效考核依據，是與 PM 最攸關的制度內容。\n【秒殺口訣】：里程碑是專案關卡，績效評估攸關 PM 職責！"},{"index":78,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"在專案中作為計算專案時間的最小單位：","options":{"A":"工作包 (Work Package)","B":"活動 (Activity)","C":"合約","D":"工作條款 (Statement of Work, SOW)"},"ans":"B","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"天王級名詞對比題","mnemonic":"WBS 到底叫工作包，時程到底叫活動！","exp":"【深度剖析】：天王級名詞對照！\n- 範疇管理 (WBS) 的最小單位：工作包 (Work Package)！\n- 時程管理 (時間) 的最小單位：活動 (Activity)！\n工作包在時程規劃中會被分解成具體活動，活動才有工期、相依性與排程！\n【秒殺口訣】：WBS 到底叫工作包，時程到底叫活動！"},{"index":79,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"以下是規劃範疇時的參考，何者而非？","options":{"A":"合約","B":"專案核准書","C":"客戶需求調查報告","D":"工作分解結構 (Work Breakdown Structure, WBS)"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.150。WBS 是範疇規劃產出的「成果產物（Output）」，並非規劃初期的輸入參考資料，故選 D。"},{"index":80,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"定義「工作包」內容時的注意事項何者為真？","options":{"A":"可度量","B":"明確的","C":"交付標的導向","D":"以上皆是"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.162。工作包必須具備具體明確、產出物導向、並且成果與進度皆可量化衡量之特徵，故選 D。"},{"index":81,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"專案中最常使用的文件溝通方式為何？","options":{"A":"刊物","B":"信件及備忘錄","C":"公文","D":"專案計畫書"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.306。信件（Email/Letters）與備忘錄（Memos）因彈性高、溝通快速且具文字存查功能，是專案團隊內部最頻繁使用的書面溝通方式，故選 B。"},{"index":82,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"要建立「責任指派矩陣 (Responsibility Assignment Matrix)」，需有\n(1) 工作分解結構 (WBS)\n(2) 組織分解結構 (OBS)\n(3) 成本分解結構 (CBS) ？","options":{"A":"(1)(2)","B":"(1)(3)","C":"(2)(3)","D":"以上皆非"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.172。RAM 矩陣橫軸為組織成員（源自 OBS），縱軸為工作項目（源自 WBS），兩者交叉建立責任矩陣，故選 (1)(2) (A)。"},{"index":83,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"採用「類比法」發展工作分解結構 (Work Breakdown Structure, WBS) 的好處為何？","options":{"A":"發展 WBS 的時間少","B":"發展 WBS 的成本少","C":"不需要專家協助","D":"不需要訓練"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.161。類比法（利用過往類似專案之樣板 Templates）直接套用歷史架構微調，其最顯著之優點就是能大幅縮減發展 WBS 的時程與時間，故選 A。"},{"index":84,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案團隊在發展新產品專案工作分解結構 (Work Breakdown Structure, WBS) 時常用的方法是：","options":{"A":"由上而下法","B":"類比法","C":"由下而上法","D":"生命週期法"},"ans":"A","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"WBS 建立方法辨析題","mnemonic":"硬體新產品由上而下，軟體系統生命週期！","exp":"【深度剖析】：課本 p.161 明訂：新產品開發（New Product Development，如硬體、機械、消費品）主流採用「由上而下法 (Top-Down)」，從整機分解至子系統與零組件；「生命週期法」則常用於「軟體系統開發」（依需求、設計、測試各階段展開）。\n【秒殺口訣】：硬體新產品由上而下，軟體系統生命週期！"},{"index":85,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"專案的主要成員與相關部門和工作包之間的關係，可由下列何者顯示：","options":{"A":"權責分派矩陣","B":"範疇說明書","C":"專案計畫書","D":"工作分解結構"},"ans":"A","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.172。展示團隊成員、相關職能部門與各工作包間具體權責對應者為「權責分派矩陣 (RAM)」，故選 A。"},{"index":86,"chapter":"CH04","chapterTitle":"CH04 專案範疇規劃","q":"以下何者關於專案計畫書 (Project Plan) 的敘述是錯的？","options":{"A":"明確定義並敘述專案計畫、執行、管制、評估與審查等之管理程序及作業","B":"專案重要里程碑與審查計畫表","C":"是專案初期的重要工作，辛苦一次就好","D":"是專案執行與控管的基準"},"ans":"C","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"漸進明細哲學題","mnemonic":"專案計畫非鐵板，漸進明細滾浪翻！","exp":"【深度剖析】：專案具有「漸進明細 (Progressive Elaboration)」與「滾浪式規劃」特性，專案計畫書絕非初期寫完就能「辛苦一次就好」，必須隨專案推展動態透過變更管制機制更新。\n【秒殺口訣】：專案計畫非鐵板，漸進明細滾浪翻！"},{"index":87,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"下列有關「專案選擇」(Project Selection) 的敘述，何者有誤？","options":{"A":"組織受限於資源的可用性，無法所有專案都照單全收","B":"如何從一堆具有不確定性的專案中，挑出值得做的專案，原本就是具有高度的挑戰性","C":"專案選擇模型 (Project Selection Models) 可以幫助高階主管制定決策","D":"專案多多益善，專案數目越多，獲利越高"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.110。組織資源有限，專案若盲目貪多將稀釋資源導致全員超載、專案全盤皆輸，「專案多多益善」為錯誤觀念，故選 D。"},{"index":88,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"下列關於專案與組織的關係之敘述，何者為非？","options":{"A":"專案需調和多數人、單位與組織的資源及工作成果","B":"主要效益來自合約的組織以及以專案來管理的組織，較適用於專案型組織","C":"組織的結構會影響專案經理對資源的使用","D":"專案組織與正式的組織結構，會增加決策所需的層級"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.53-70。專案組織採取扁平化矩陣或專案型授權，旨在打破官僚壁壘、「縮短決策層級」加速決策，絕非增加層級，故選 D。"},{"index":89,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"每個專案的關鍵性利害關係人，基本上應包括：\n(1) 專案經理\n(2) 顧客\n(3) 執行專案之組織\n(4) 專案團隊與成員","options":{"A":"(1)(3)","B":"(1)(3)(4)","C":"(2)(3)(4)","D":"(1)(2)(3)(4)"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.132。專案四大核心利害關係人包含 PM 本人、客戶買方、承擔執行之母體組織以及全體團隊成員，全數為關鍵關係人，故選 D。"},{"index":90,"chapter":"CH03","chapterTitle":"CH03 專案起始","q":"下列何者是專案起始程序 (Project Initiating Process) 的重要產出？","options":{"A":"專案計畫書 (Project Plan)","B":"工作說明書 (Statement of Work, SOW)","C":"專案章程 (Project Charter)","D":"責任分派矩陣 (RAM)"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.108。專案起始程序的核心里程碑產出就是正式的專案章程，故選 C。"},{"index":91,"chapter":"CH01","chapterTitle":"CH01 專案管理概論","q":"下列何者的主要任務之一就是作為各專案的「圖書館」或「文件控制中心」，以集中掌控所有專案相關的文件？","options":{"A":"專案經理","B":"專案管理辦公室 (PMO)","C":"公司秘書","D":"總務"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.39。PMO 支援型核心職責之一，即為集中保管組織流程資產、專案歷史檔案與範本，扮演專案圖書館與文件控制中心，故選 B。"},{"index":92,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"下列何者不是建立專案團隊的考量？","options":{"A":"專案特性","B":"組織架構","C":"專案成員的角色及能力","D":"專案經理的偏好"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.295。團隊組建應基於客觀的專案專業技能需求、組織架構授權與成員適性能力，不可憑專案經理個人的主觀偏好選人，故選 D。"},{"index":93,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"根據過程改善計畫所摘要的步驟，從組織及技術的立場，辨識所需之改善。是專案執行過程中管理品質的哪一種方法？","options":{"A":"品質稽核","B":"過程分析","C":"績效衡量","D":"專案審查"},"ans":"B","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.310。依循過程改善計畫，審視技術與組織作業流程以找出非增值活動與瓶頸的方法，稱為「過程分析 (Process Analysis)」，故選 B。"},{"index":94,"chapter":"CH05","chapterTitle":"CH05 專案時程規劃","q":"在資源有限的情況下進行專案規劃時，透過參考專案總資源需要度來指導專案的方法是？","options":{"A":"資源撫平","B":"資源分散","C":"資源分派","D":"資源重置"},"ans":"C","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：官方 A 卷解答表核定正解為 C「資源分派 (Resource Allocation)」。在資源受限條件下進行專案規劃時，藉由檢視各活動對專案整體資源的需要程度（需求強度與優先序），將有限資源分配指派給特定活動的方法，稱為資源分派。"},{"index":95,"chapter":"CH02","chapterTitle":"CH02 專案環境與專案經理","q":"在矩陣型組織的設計上，通常會依據哪些因素來調整矩陣之強度？","options":{"A":"組織的文化","B":"專案任務的重要程度","C":"組織的專案管理能力","D":"以上皆是"},"ans":"D","isHighFrequencyTrap":false,"isCalculation":false,"trapType":null,"mnemonic":null,"exp":"【正解依據】：課本 p.62。矩陣強度的拿捏取決於企業文化信任度、專案戰略重要性以及團隊專案管理成熟度等多維因素，故選 D。"},{"index":96,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"會議的目的是要促使專案團隊成員彼此了解，凝聚達成專案目標的共識。是哪一種類型的專案會議？","options":{"A":"專案團隊工作會議","B":"專案協調會","C":"專案啟動會議","D":"管理高層會議"},"ans":"C","isHighFrequencyTrap":true,"isCalculation":false,"trapType":"會議類型辨析題","mnemonic":"啟動會議凝聚共識，例行工作檢討進度！","exp":"【深度剖析】：專案啟動會議（Kick-off Meeting）於規劃完成後、執行開工前召開，主要目的是讓成員破冰相識、明確角色權責、宣示專案開跑並「凝聚達成目標的共識」。而團隊工作會議是每週檢討進度的例行會議。\n【秒殺口訣】：啟動會議凝聚共識，例行工作檢討進度！"},{"index":97,"chapter":"CH08","chapterTitle":"CH08 專案執行","q":"專案團隊每週或某一時間內對工作狀況進行檢討所召開的會議。是哪一種類型的專案會議？","options":{"A":"專案團隊工作會議","B":"專案協調會","C":"專案啟動會議","D":"管理高層會議"},"ans":"A","isHighFrequencyTrap":f         let metaTags = `

        if (q.isHighFrequencyTrap) {
          metaTags += `<span class="q-exam-status-tag tag-trap">⚡ 高頻易錯陷阱</span>`;
        }

        if (q.isCalculation) {
          metaTags += `<span class="q-exam-status-tag tag-calc">🧮 數理計算</span>`;
        }

        let optionsHtml = '';
        ['A', 'B', 'C', 'D'].forEach(key => {

          if (currentMainMode === 'STUDY') {
            // Study Mode: highlight official answer directly
            if (key === q.ans) btnClass += ' opt-correct';
          } else {
            // Quiz Mode: react to user choices
            if (isAnswered) {
              if (key === q.ans) btnClass += ' opt-correct';
              else if (key === uAns) btnClass += ' opt-wrong';
              if (key === uAns) btnClass += ' opt-user-selected';
            }
          }

          optionsHtml += `
            <button class="${btnClass}" onclick="selectOption(${q.index}, '${key}')">

    function renderSidebar() {

      if (activeFilter === 'QUIZ_WRONG') {
        return examQuestions.filter(q => userAnswers[q.index] !== undefined && userAnswers[q.index] !== q.ans);

    let canvas, ctx;
    let isDrawing = false;
    let penColor = '#18181b';

    function setupCanvas() {
      canvas = document.getElementById('scratchpad-canvas');
      ctx = canvas.getContext('2d');

      function resize() {
        const wrapper = document.getElementById('scratchpad-wrapper');
        if (wrapper && wrapper.clientWidth > 0) {
          canvas.width = wrapper.clientWidth;
          canvas.height = wrapper.clientHeight;
        }
      }
      window.addEventListener('resize', resize);
      setTimeout(resize, 200);

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseleave', stopDraw);
    }

    function startDraw(e) {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    }
    function draw(e) {
      if (!isDrawing) return;
      ctx.strokeStyle = penColor;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    }
    function stopDraw() { isDrawing = false; }
    function setPenColor(col) { penColor = col; }
    function clearScratchpad() {
      if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    function openScratchpad() {
      document.getElementById('scratchpad-modal').classList.add('show');
      setTimeout(() => {
        const wrapper = document.getElementById('scratchpad-wrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
      }, 50);
    }
    function closeScratchpad() {
      document.getElementById('scratchpad-modal').classList.remove('show');
    }

    window.onload = init;
  </script>
</body>
</html>
